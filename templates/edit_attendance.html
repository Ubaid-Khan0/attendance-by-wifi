{% extends 'base.html' %}{% block title %}Correct Attendance{% endblock %}{% block content %}<header class="topbar"><div><h1>Correct Attendance</h1><p class="subtitle">{{ record.full_name }} · {{ record.attendance_date }}</p></div></header><section class="content-card"><form method="post" class="employee-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label>Check in</label><input type="datetime-local" name="check_in" value="{{ record.check_in|replace(' ','T') if record.check_in else '' }}"></div><div class="form-field"><label>Check out</label><input type="datetime-local" name="check_out" value="{{ record.check_out|replace(' ','T') if record.check_out else '' }}"></div><div class="form-field"><label>Reason</label><input name="reason" required></div><div class="form-field"><label>Admin password</label><input type="password" name="admin_password" required></div><label><input type="checkbox" name="is_invalid" {% if not record.is_valid %}checked{% endif %}> Mark this record invalid</label><button class="primary-button">Save Audited Correction</button></form></section>{% endblock %}
