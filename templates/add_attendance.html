{% extends 'base.html' %}{% block title %}Add Missing Attendance{% endblock %}{% block content %}<header class="topbar"><div><h1>Add Missing Attendance</h1><p class="subtitle">Manual records are saved with an audit entry.</p></div></header><section class="content-card"><form method="post" class="employee-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label>Employee</label><select name="employee_id" required>{% for p in people %}<option value="{{ p.id }}">{{ p.full_name }} ({{ p.employee_code }})</option>{% endfor %}</select></div><div class="form-field"><label>Check in</label><input type="datetime-local" name="check_in" required></div><div class="form-field"><label>Check out</label><input type="datetime-local" name="check_out"></div><div class="form-field"><label>Reason</label><input name="reason" required></div><div class="form-field"><label>Admin password</label><input type="password" name="admin_password" required></div><button class="primary-button">Add Audited Record</button></form></section>{% endblock %}
