{% extends 'base.html' %}
{% block title %}Edit Employee{% endblock %}
{% block content %}
<header class="topbar"><div><h1>Edit Employee</h1><p class="subtitle">Employee ID cannot be changed or reused.</p></div></header>
<section class="content-card">
    <div class="section-header"><h2>{{ employee.full_name }}</h2></div>
    <form method="post" class="employee-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-field"><label>Employee ID</label><input value="{{ employee.employee_code }}" disabled></div>
        <div class="form-field"><label>Full name</label><input name="full_name" value="{{ employee.full_name }}" required></div>
        <div class="form-field"><label>CNIC</label><input name="cnic" value="{{ employee.cnic or '' }}" inputmode="numeric" minlength="13" maxlength="15" required></div>
        <div class="form-field"><label>Email address</label><input type="email" name="email" value="{{ employee.email or '' }}" required></div>
        <div class="form-field"><label>Monthly salary</label><input type="number" name="monthly_salary" min="0.01" step="0.01" value="{{ employee.monthly_salary or '' }}" required></div>
        <div class="form-field"><label>Bank name</label><input name="bank_name" value="{{ employee.bank_name or '' }}" required></div>
        <div class="form-field"><label>Account number / IBAN</label><input name="account_number" value="{{ employee.account_number or '' }}" required></div>
        <div class="form-field"><label>Department</label><input name="department" value="{{ employee.department or '' }}"></div>
        <div class="form-field"><label>Role</label><select name="role" required><option value="employee" {% if employee.role == 'employee' %}selected{% endif %}>Employee</option><option value="intern" {% if employee.role == 'intern' %}selected{% endif %}>Intern</option><option value="manager" {% if employee.role == 'manager' %}selected{% endif %}>Manager</option><option value="hr" {% if employee.role == 'hr' %}selected{% endif %}>HR</option></select></div>
        <label class="checkbox-field"><input type="checkbox" name="is_active" {% if employee.is_active %}checked{% endif %}> Active account</label>
        <div class="form-actions"><button class="primary-button">Save Changes</button><a class="secondary-button" href="{{ url_for('employees') }}">Cancel</a></div>
    </form>
</section>
{% endblock %}
